apiVersion: v1
kind: Namespace
metadata:
  name: postgres-manager-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-manager
  namespace: postgres-manager-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-manager
  namespace: postgres-manager-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-manager
    spec:
      serviceAccountName: postgres-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: postgres-manager:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
