apiVersion: postgres.example.com/v1alpha1
kind: PostgresCluster
metadata:
  name: regional
  namespace: databases
spec:
  region: local
  instances: 2
  postgres:
    majorVersion: 17
    image: postgres-manager-postgres:dev
    parameters:
      max_connections: "50"
      shared_buffers: 64MB
  replication:
    mode: Synchronous
    dataLossPolicy: Lossless
    credentialsSecretRef:
      name: regional-replication
    tlsSecretRef:
      name: regional-tls
  bootstrap:
    initdb:
      superuserSecretRef:
        name: regional-bootstrap
      checksums: true
  storage:
    data:
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  deletionPolicy: Retain
